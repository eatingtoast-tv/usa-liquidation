<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="USA Admin">
<meta name="theme-color" content="#1B2B57">
<link rel="apple-touch-icon" href="/images/logo-color.png">
<title>USA Liquidation Admin</title>
<style>
  :root { --bg:#F7F3EC; --card:#fff; --ink:#16213A; --muted:#5E6676; --line:#E3DCD0; --brand:#1B2B57; --red:#C62032; --good:#2F7D4F; --warn:#B7791F; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 system-ui,-apple-system,sans-serif; padding-bottom:90px; }
  header { background:var(--brand); color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header img { width:34px; height:34px; border-radius:8px; background:#fff; }
  header b { flex:1; font-size:18px; }
  header button { background:none; border:1px solid #fff6; color:#fff; border-radius:8px; padding:6px 10px; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  h2 { margin:0 0 12px; font-size:20px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; font-weight:600; }
  input, select, textarea { width:100%; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:12px; padding:15px; font-size:18px; font-weight:700; background:var(--brand); color:#fff; margin-top:14px; cursor:pointer; }
  .btn.red { background:var(--red); } .btn.light { background:#fff; color:var(--brand); border:2px solid var(--brand); }
  .btn:disabled { opacity:.5; }
  .big-photo { display:flex; flex-direction:column; gap:10px; }
  .big-photo .btn { padding:22px; font-size:20px; margin:0; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .thumbs div { position:relative; } .thumbs img { width:84px; height:84px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
  .thumbs button { position:absolute; top:-6px; right:-6px; width:26px; height:26px; border-radius:50%; border:0; background:var(--red); color:#fff; font-weight:700; }
  .ai { font-size:14px; color:var(--brand); background:#E8ECF6; border-radius:10px; padding:10px 12px; margin-top:12px; display:none; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; border:0; background:none; padding:10px 0 12px; font-size:12px; color:var(--muted); font-weight:600; }
  nav button span { display:block; font-size:22px; }
  nav button.on { color:var(--brand); }
  .item { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border:0; }
  .item img { width:64px; height:64px; object-fit:cover; border-radius:10px; background:#eee; flex:none; }
  .item .info { flex:1; min-width:0; } .item .info b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:20px; background:#E3F1E8; color:var(--good); }
  .pill.Sold { background:#F8E3E5; color:var(--red); } .pill.On\ Hold, .pill.Coming\ Soon { background:#FBF0DC; color:var(--warn); }
  .item .edit { border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; font-weight:600; color:var(--brand); }
  .seg { display:flex; gap:8px; margin-top:10px; } .seg button { flex:1; padding:12px 4px; border-radius:10px; border:2px solid var(--line); background:#fff; font-weight:700; font-size:15px; color:var(--ink); }
  .seg button.on { border-color:var(--brand); background:var(--brand); color:#fff; }
  .day { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .day b { width:100px; flex:none; } .day input[type=text] { flex:1; min-width:0; padding:10px; } .day input[type=number] { width:90px; flex:none; padding:10px; } .day input[type=checkbox] { width:26px; height:26px; flex:none; }
  .search { margin-bottom:10px; }
  .filters { display:flex; gap:6px; overflow-x:auto; margin-bottom:8px; } .filters button { flex:none; border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 12px; font-size:14px; }
  .filters button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  #toast { position:fixed; left:16px; right:16px; bottom:96px; background:var(--ink); color:#fff; padding:14px 16px; border-radius:12px; font-weight:600; text-align:center; display:none; z-index:20; }
  #sheet { position:fixed; inset:0; background:#0007; display:none; align-items:flex-end; z-index:10; }
  #sheet .card { width:100%; max-width:560px; margin:0 auto; border-radius:20px 20px 0 0; padding-bottom:calc(20px + env(safe-area-inset-bottom)); max-height:90vh; overflow:auto; }
  #login { max-width:380px; margin:12vh auto 0; text-align:center; }
  #login img { width:90px; border-radius:16px; }
  .hide { display:none !important; }
  .muted { color:var(--muted); font-size:14px; }
  .spin { width:18px; height:18px; border:3px solid #fff6; border-top-color:#fff; border-radius:50%; animation:s 0.8s linear infinite; } @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="hide">
  <main id="login">
    <img src="/images/logo-color.png" alt="">
    <h2 style="margin-top:14px">USA Liquidation Admin</h2>
    <form id="loginForm" class="card">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Log in</button>
      <p id="loginErr" class="muted" style="color:var(--red)"></p>
    </form>
  </main>
</div>

<!-- APP -->
<div id="appView" class="hide">
  <header><img src="/images/logo-color.png" alt=""><b id="title">Add Item</b><button id="logout">Log out</button></header>
  <main>

    <!-- ADD FURNITURE -->
    <section id="tab-add">
      <div class="card">
        <div class="big-photo">
          <button class="btn red" data-pick="add" data-capture="1">📷 Take Photo</button>
          <button class="btn light" data-pick="add">🖼️ Choose from Photos</button>
        </div>
        <div class="thumbs" id="addThumbs"></div>
        <div class="ai" id="aiNote"></div>
      </div>
      <form class="card" id="addForm">
        <label>Name</label><input name="name" required placeholder="e.g. Gray Sectional Sofa">
        <div class="row">
          <div><label>Our Price $</label><input name="price" type="number" inputmode="decimal" placeholder="0"></div>
          <div><label>Retail Price $</label><input name="retail" type="number" inputmode="decimal" placeholder="optional"></div>
        </div>
        <div class="row">
          <div><label>Category</label><select name="category">
            <option>Living Room</option><option>Bedroom</option><option>Dining</option><option>Office</option><option>Outdoor</option><option>Decor &amp; Other</option><option>Gym Equipments</option></select></div>
          <div><label>Condition</label><select name="condition">
            <option>New</option><option>New - Open Box</option><option selected>Like New</option><option>Good</option><option>Fair</option></select></div>
        </div>
        <label>Size (optional)</label><input name="size" placeholder="e.g. Queen, 84&quot; wide">
        <label>Description</label><textarea name="description"></textarea>
        <button class="btn" type="submit" id="addSave">✅ Put it on the website</button>
      </form>
    </section>

    <!-- ITEMS -->
    <section id="tab-items" class="hide">
      <input class="search" id="q" placeholder="🔍 Search items">
      <div class="filters" id="statusFilter">
        <button class="on" data-f="Available">Available</button><button data-f="On Hold">On Hold</button><button data-f="Sold">Sold</button><button data-f="">All</button>
      </div>
      <div class="card" id="itemList"><p class="muted">Loading…</p></div>
    </section>

    <!-- BINS -->
    <section id="tab-bins" class="hide">
      <div class="card">
        <h2>Today's bins photo</h2>
        <p class="muted">Snap the bins — it shows on the website right away.</p>
        <label>Which day?</label><select id="binDay"></select>
        <div class="big-photo" style="margin-top:12px">
          <button class="btn red" data-pick="bins" data-capture="1">📷 Take Bins Photo</button>
          <button class="btn light" data-pick="bins">🖼️ Choose from Photos</button>
        </div>
        <div class="thumbs" id="binsThumbs"></div>
        <button class="btn" id="binsPhotoSave">Save photo</button>
      </div>
      <div class="card">
        <h2>Prices by day</h2>
        <p class="muted">Untick a day if you're closed.</p>
        <div id="binDays"><p class="muted">Loading…</p></div>
        <button class="btn" id="binsSave">Save prices</button>
      </div>
    </section>

    <!-- TRAILERS -->
    <section id="tab-trailers" class="hide">
      <div class="card" id="trailerList"><p class="muted">Loading…</p></div>
      <form class="card" id="trailerForm">
        <h2>Add a food trailer</h2>
        <div class="big-photo">
          <button type="button" class="btn red" data-pick="trailer" data-capture="1">📷 Take Photo</button>
          <button type="button" class="btn light" data-pick="trailer">🖼️ Choose from Photos</button>
        </div>
        <div class="thumbs" id="trailerThumbs"></div>
        <label>Name</label><input name="name" required placeholder="e.g. 16 ft Concession Trailer">
        <div class="row">
          <div><label>Price $</label><input name="price" type="number" inputmode="decimal"></div>
          <div><label>Size</label><select name="size"><option value="">—</option><option>8-12 ft</option><option>14-16 ft</option><option>18-20 ft</option><option>24 ft+</option></select></div>
        </div>
        <label>Status</label><select name="status"><option>In Stock</option><option>Coming Soon</option><option>Sold</option></select>
        <label>Features</label><textarea name="features" placeholder="Hood, fryer, sinks, generator…"></textarea>
        <label>Description</label><textarea name="description"></textarea>
        <button class="btn" type="submit">Add trailer</button>
      </form>
      <div class="card">
        <h2>Gallery photo</h2>
        <p class="muted">For "trailers we've built/sold" photos.</p>
        <div class="big-photo">
          <button class="btn light" data-pick="gallery">🖼️ Choose Photos</button>
        </div>
        <div class="thumbs" id="galleryThumbs"></div>
        <label>Caption</label><input id="galleryCaption" placeholder="e.g. BBQ trailer for Mike's Smokehouse">
        <button class="btn" id="gallerySave">Add to gallery</button>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="add" class="on"><span>➕</span>Add</button>
    <button data-tab="items"><span>🛋️</span>Items</button>
    <button data-tab="bins"><span>🧺</span>Bins</button>
    <button data-tab="trailers"><span>🚚</span>Trailers</button>
  </nav>
</div>

<!-- EDIT SHEET -->
<div id="sheet"><div class="card" id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple class="hide">

<script src="/admin/admin.js?v=1"></script>
</body>
</html>
